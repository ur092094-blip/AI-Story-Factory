
name: Daily AI Story Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate AI story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python story_generator.py

      - name: Save generated story
        run: |
          git config user.name "AI Story Bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/story.md
          git commit -m "Generate daily AI story" || echo "No changes"
          git push
